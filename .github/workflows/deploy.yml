name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # FT-R-100: a red tests.html suite stops the job here, before the Pages artifact exists, so nothing deploys.
      - name: Install the test browser
        run: npx playwright-core install --with-deps chromium
      - name: Run tests.html headless against dist
        run: npm run test:ci
      # The gate needs tests.html in dist; the public site does not. Rebuild without it (and without its chunks and precache entries).
      - name: Rebuild without the test page
        run: npm run build
        env:
          FT_NO_TESTS: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # G6W12-5: only the deploy job may write Pages or mint the OIDC token; the build job runs third-party code with contents: read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
